<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flora Nativa Pehuenia</title>

  <!-- TensorFlow.js y Teachable Machine Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121814;
      color: #e2ebd8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; color: #81c784; margin-bottom: 2px; }
    p { font-size: 0.85rem; color: #a3b899; }

    #view-wrapper {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1 / 1;
      background: #1e2620;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #388e3c;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* Regla CSS clave para evitar la pantalla negra en móviles */
    #video-feed, #image-preview {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin-top: 14px;
    }

    .btn {
      background-color: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
    }
    .btn-secondary { background-color: #37474f; box-shadow: none; }
    .btn:active { opacity: 0.85; }

    #label-container {
      width: 100%;
      max-width: 340px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prediction-card {
      background: #1e2620;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2d3b30;
    }

    .prediction-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background-color: #2d3b30;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #66bb6a;
      width: 0%;
      transition: width 0.15s ease-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>Flora Nativa Pehuenia</h1>
    <p>Identificador con Inteligencia Artificial</p>
  </header>

  <div id="view-wrapper">
    <span id="placeholder" style="color: #78909c; padding: 12px; text-align: center;">
      Tocá un botón para encender
    </span>
    <video id="video-feed" autoplay playsinline style="display:none;"></video>
    <img id="image-preview" style="display:none;" alt="Planta capturada">
  </div>

  <div class="btn-container">
    <button class="btn" onclick="initLiveCamera()">Iniciar Cámara en Vivo</button>
    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">Tomar Foto / Cargar Imagen</button>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none;" onchange="processFastImage(this.files)">
  </div>

  <div id="label-container"></div>

  <!-- Canvas auxiliar para acelerar la clasificación de fotos -->
  <canvas id="compressor-canvas" width="224" height="224" style="display:none;"></canvas>

  <script>
    // ------------------------------------------------------------------------
    // VERIFICÁ QUE TU URL DE TEACHABLE MACHINE TERMINE EN DIAGONAL "/"
    // ------------------------------------------------------------------------
    const URL_MODELO = "https://teachablemachine.withgoogle.com/models/-uzpS_rX1/";

    let model, maxPredictions;
    let videoElement = document.getElementById("video-feed");
    let imgElement = document.getElementById("image-preview");
    let placeholder = document.getElementById("placeholder");
    let isLive = false;

    async function getModel() {
      if (!model) {
        placeholder.innerText = "Cargando modelo IA...";
        placeholder.style.display = "block";
        
        if (URL_MODELO.includes("TU_MODELO_AQUI")) {
          alert("Recordá pegar la URL de tu modelo de Teachable Machine en el código.");
          placeholder.innerText = "Error: Falta URL del modelo";
          return false;
        }

        try {
          const fullURL = URL_MODELO.endsWith("/") ? URL_MODELO : URL_MODELO + "/";
          model = await tmImage.load(fullURL + "model.json", fullURL + "metadata.json");
          maxPredictions = model.getTotalClasses();
          buildUI();
          return true;
        } catch (e) {
          console.error(e);
          alert("Error al descargar el modelo. Verificá la URL o la conexión.");
          placeholder.innerText = "Error de conexión";
          return false;
        }
      }
      return true;
    }

    function buildUI() {
      const container = document.getElementById("label-container");
      container.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        container.innerHTML += `
          <div class="prediction-card">
            <div class="prediction-header">
              <span id="name-${i}">Clase ${i+1}</span>
              <span id="prob-${i}">0%</span>
            </div>
            <div class="progress-bg">
              <div id="fill-${i}" class="progress-fill"></div>
            </div>
          </div>`;
      }
    }

    // CÁMARA EN VIVO
    async function initLiveCamera() {
      const loaded = await getModel();
      if (!loaded) return;

      try {
        isLive = false;
        
        // Solicitar el stream de video
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 640 } },
          audio: false
        });

        videoElement.srcObject = stream;
        imgElement.style.display = "none";
        placeholder.style.display = "none";
        videoElement.style.display = "block";

        // Forzar reproducción del elemento video en móviles
        await videoElement.play();

        isLive = true;
        requestAnimationFrame(predictLoop);
      } catch (err) {
        alert("No se pudo iniciar la cámara en vivo. Usá la opción 'Tomar Foto / Cargar Imagen'.");
        console.error(err);
      }
    }

    async function predictLoop() {
      if (isLive && videoElement.readyState === 4) {
        const predictions = await model.predict(videoElement);
        updateResults(predictions);
        requestAnimationFrame(predictLoop);
      } else if (isLive) {
        requestAnimationFrame(predictLoop);
      }
    }

    // FOTO INSTANTÁNEA
    async function processFastImage(files) {
      if (!files || files.length === 0) return;

      const loaded = await getModel();
      if (!loaded) return;

      isLive = false;
      if (videoElement.srcObject) {
        videoElement.srcObject.getTracks().forEach(track => track.stop());
      }

      placeholder.innerText = "Procesando foto...";
      placeholder.style.display = "block";

      const file = files[0];
      const tempImg = new Image();
      tempImg.src = URL.createObjectURL(file);

      tempImg.onload = async () => {
        const canvas = document.getElementById("compressor-canvas");
        const ctx = canvas.getContext("2d");
        ctx.drawImage(tempImg, 0, 0, 224, 224);

        imgElement.src = canvas.toDataURL("image/jpeg", 0.85);
        imgElement.style.display = "block";
        videoElement.style.display = "none";
        placeholder.style.display = "none";

        const predictions = await model.predict(canvas);
        updateResults(predictions);
      };
    }

    function updateResults(predictions) {
      for (let i = 0; i < maxPredictions; i++) {
        const pct = (predictions[i].probability * 100).toFixed(0);
        document.getElementById(`name-${i}`).innerText = predictions[i].className;
        document.getElementById(`prob-${i}`).innerText = pct + "%";

        const bar = document.getElementById(`fill-${i}`);
        bar.style.width = pct + "%";
        bar.style.backgroundColor = pct > 70 ? "#81c784" : "#4caf50";
      }
    }
  </script>
</body>
</html>
